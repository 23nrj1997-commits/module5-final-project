<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="flex flex-col">
      <div class="navbar flex flex-col">
        <div class="flex content-wrapper justify-between align-center">
          <div class="logo">
            <img src="" alt="Blinker Logo" class="logo">
          </div>
          <div class="links flex align-center justify-between">
            <a href="" class="link router-link-active">Home</a>
            <a href="" class="link router-link-exact-active router-link-active">pick your movie</a>
            <a href="" class="btn-contact">Contact</a>
          </div>
          <div id="phone-nav">

          </div>
        </div>
        <div class="content-wrapper flex-col align-center">
          <h1>Explore Our Movies</h1>
          <div class="input-wrapper">
            <input type="text" placeholder="Search by Title">
            <div class="search-wrapper flex justify-center align-center">
              <i class="fa-search">

              </i>
            </div>
          </div>
        </div>
        <div class="overlay">
          
        </div>
      </div>
      <section id="search">
        <div class="md-progress-bar md-indeterminate md-theme-default">
          <div class="md-progress-bar-track">

          </div>
          <div class="md-progress-bar-fill">

          </div>
          <div class="md-progress-bar-buffer">

          </div>
        </div>
        <div id="filter" class="content-wrapper justify-between">
          <h1 class="search-info">
            <span class="black-txt">Search results for
            </span>
          </h1>
        </div>
        <div id="movies">
          <div class="content-wrapper">
            <div class="loading-state flex justify-center">

            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
