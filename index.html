<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/7324caa814.js" crossorigin="anonymous"></script>
  <script src="script.js" defer></script>
</head>
<body>
    <div class="app">
      <div class="flex flex-col background">
        <div class="navbar flex flex-col">
          <div class="flex content-wrapper justify-between align-center nav">
            <div class="logo">
              <img src="	https://dev.d24jig8s1lr7n9.amplifyapp.com/img/whitelogo.39850b27.png" alt="Blinker Logo" class="logo">
            </div>
            <div class="links flex align-center justify-between">
              <a href="" class="link router-link-active">Home</a>
              <a href="" class="link router-link-exact-active router-link-active">pick your movie</a>
              <a href="" class="btn-contact">Contact</a>
            </div>
            <button class="nav__burger" id="navBurger" aria-label="Toggle menu" aria-expanded="false">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
          <div class="content-wrapper flex-col align-center">
            <h1>Explore Our Movies</h1>
            <div class="input-wrapper">
             <input type="text" placeholder="Search by Title" onChange="onSearchChange(event)">
              <div class="search-wrapper flex justify-center align-center">
                <i 
                  class="fa-solid     fa-magnifying-glass" onchange="onSearchChange(event)">
                </i>
              </div>
            </div>
          </div>
          <div class="overlay">
          
          </div>
        </div>
      </div>
      <section class="search">
        <div class="md-progress-bar md-indeterminate md-theme-default">
          <div class="md-progress-bar-track">

          </div>
          <div class="md-progress-bar-fill">

          </div>
          <div class="md-progress-bar-buffer">

          </div>
        </div>
        <div class="filter" class="content-wrapper justify-between">
          <h1 class="search-info">
            <span class="black-txt">Search results for:
            </span>
            <span class="search-term"><span class="searchName">

            </span></span>
          </h1>
          <select id="Filter" onChange="filterMovies(event)">
              <option value="" disabled selected>Sort by</option>
              <option value="OLD_TO_NEW">Old to New</option>
              <option value="NEW_TO_OLD">New to Old</option>
            </select>
        </div>
      </section>
      <div class="movies">
         
      </div>
    </div>
  </div>
  <footer>
    <p>&copy; 2026 Blinker. All rights reserved.</p>
  </footer>
</body>
</html>
